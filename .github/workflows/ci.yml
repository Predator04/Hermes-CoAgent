name: "CI — Syntax Check & Compile"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-check:
    name: "Syntax check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile server entry point
        run: python -c "compile(open('hermes_coagent.py').read(), 'hermes_coagent.py', 'exec')"

      - name: Run syntax smoke test
        run: python scripts/test_compile.py
