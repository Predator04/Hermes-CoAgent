<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CoAgent Companion</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 12px;
      width: 300px;
      background: #f8f9fa;
      color: #202124;
    }
    h1 {
      font-size: 13px;
      margin: 0 0 10px 0;
      font-weight: 600;
    }
    label {
      display: block;
      margin-top: 8px;
      font-weight: 500;
      color: #5f6368;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      margin-top: 3px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }
    button {
      margin-top: 10px;
      padding: 6px 12px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    button:hover { background: #1765cc; }
    button:disabled { background: #9aa0a6; cursor: default; }
    .status-block {
      margin-top: 12px;
      padding: 8px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }
    .status-row {
      display: flex;
      align-items: center;
      margin-bottom: 4px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: #9aa0a6;
    }
    .dot.ok { background: #34a853; }
    .dot.err { background: #ea4335; }
    .muted { color: #5f6368; }
    .mono { font-family: monospace; word-break: break-all; }
    .small { font-size: 11px; }
    #saveMsg { margin-left: 8px; color: #34a853; font-size: 11px; }
  </style>
</head>
<body>
  <h1>CoAgent Companion</h1>

  <label for="serverUrl">Server URL</label>
  <input type="text" id="serverUrl" placeholder="http://127.0.0.1:9123" />

  <label for="token">Bearer Token</label>
  <input type="password" id="token" placeholder="(paste token)" />

  <div>
    <button id="saveBtn">Save &amp; Reconnect</button>
    <span id="saveMsg"></span>
  </div>

  <div class="status-block">
    <div class="status-row">
      <span class="dot" id="connDot"></span>
      <span id="connText" class="muted">checking…</span>
    </div>
    <div class="small muted" id="serverInfo"></div>
  </div>

  <div class="status-block">
    <div class="small muted">Last command</div>
    <div class="mono small" id="lastCmd">—</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
